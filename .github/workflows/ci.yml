name: CI

# What this pipeline is actually for: the claims in this repository's
# documentation are checked here, not just its code. A dashboard threshold that
# drifts from the SLO it renders, an accessibility regression in a product about
# accessibility, or an alignment kernel that stops producing the reference's
# exact answer are all build failures.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: tests · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check src bench tools tests training ebpf
      - name: tests
        run: pytest -q

  guarantees:
    name: guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      # The dashboards and the 31 alert rules are generated from the SLO
      # definitions. If a panel threshold no longer matches the objective the
      # probes are measured against, the build fails rather than shipping a
      # dashboard that quietly disagrees with the system.
      - name: Grafana assets match the SLO definitions
        run: |
          python tools/generate_grafana_assets.py
          git diff --exit-code observability/ \
            || (echo "::error::generated Grafana assets are stale - run tools/generate_grafana_assets.py" && exit 1)

      # A product about accessibility that is not itself accessible is
      # self-refuting. 63 checks; any regression fails the build. The committed
      # report is diffed too, for the same reason the Grafana assets are: a
      # published conformance artifact that no longer describes the product is
      # worse than no artifact at all.
      - name: product accessibility audit
        run: python tools/a11y_audit.py --out docs/accessibility_audit.json
      - name: the committed accessibility report matches the audit
        run: |
          git diff --exit-code docs/accessibility_audit.json \
            || (echo "::error::docs/accessibility_audit.json is stale - run tools/a11y_audit.py --out docs/accessibility_audit.json" && exit 1)

      # The accelerated alignment kernels must produce the reference's exact
      # alignment - not merely an equally optimal one (docs/PERFORMANCE.md).
      - name: alignment kernel parity
        run: pytest -q tests/test_kernels_parity.py

      - name: SBOM is current
        run: python tools/generate_sbom.py --check

      # The training pipeline is optional and needs no accelerator to validate:
      # this checks the configs, the datasets and the privacy assertions.
      - name: training config and privacy assertions
        run: |
          python training/build_dataset.py --scenarios 4 --out var/training
          for adapter in status_writer operator_brief log_labeller; do
            PYTHONPATH=src:training python training/train_qlora.py --adapter "$adapter" --dry-run
          done

      - name: eBPF configuration
        run: python ebpf/loader.py --dry-run

  closed-loop:
    name: closed loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      # The hero incident, end to end, with no credentials and no network. If
      # this cannot close, nothing else in the repository matters.
      - name: hero incident closes
        run: |
          accesspulse hero --json hero.json
          python - <<'PY'
          import json, sys
          run = json.load(open("hero.json"))
          result = run["result"]
          failures = []
          if not result["detected"]:
              failures.append("incident was not detected")
          if not result["recovered"]:
              failures.append("incident did not reach a verified recovery")
          if result["unsafe_action"]:
              failures.append("an unsafe action was executed")
          if result["assertions_passing"] != result["assertions_total"]:
              failures.append(
                  f"verification incomplete: {result['assertions_passing']}"
                  f"/{result['assertions_total']}")
          tools = {c["tool"] for c in run["mcp_calls"]}
          required = {"list_alert_rules", "query_prometheus", "query_loki_logs",
                      "query_tempo_traces", "search_dashboards"}
          missing = required - tools
          if missing:
              failures.append(f"investigation skipped Grafana MCP tools: {sorted(missing)}")
          if failures:
              print("\n".join(f"::error::{f}" for f in failures))
              sys.exit(1)
          print(f"closed loop verified: {result['mcp_calls']} MCP calls, "
                f"{result['assertions_passing']}/{result['assertions_total']} assertions")
          PY

      # A short benchmark run. Not the published 1,000-scenario result - that
      # takes 44 minutes - but enough to catch a regression that breaks
      # detection, safety or closure.
      - name: benchmark smoke
        run: |
          python -m bench.harness --scenarios 45 --no-ablations --out /tmp/bench --workers 2
          python - <<'PY'
          import json, sys
          s = json.load(open("/tmp/bench/summary.json"))
          checks = {
              "detection rate": (s["detection"]["detection_rate"], 1.0, "eq"),
              "unsafe action rate": (s["agent"]["unsafe_action_rate"], 0.0, "eq"),
              "false closure rate": (s["verification"]["false_closure_rate"], 0.02, "le"),
              "top-3 accuracy": (s["diagnosis"]["top3_accuracy"], 0.75, "ge"),
              "scope precision": (s["scope"]["mean_precision"], 0.95, "ge"),
          }
          failed = False
          for name, (value, bound, op) in checks.items():
              ok = value == bound if op == "eq" else \
                   value <= bound if op == "le" else value >= bound
              print(f"{'ok ' if ok else 'FAIL'} {name}: {value} ({op} {bound})")
              failed |= not ok
          sys.exit(1 if failed else 0)
          PY

  image:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: accesspulse:ci
      # The image must run the demonstration with no credentials, because that
      # is what a judge will do (docs/JUDGE.md).
      - name: the image runs the closed loop with no credentials
        run: docker run --rm accesspulse:ci accesspulse hero

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform fmt -check -recursive

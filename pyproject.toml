[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raccord"
version = "0.1.0"
description = "Raccord - Accessible Experience Reliability Platform (Grafana track, Agentic Cinema)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Raccord Team" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "PyYAML>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
# Cloud / partner runtime. Not required for the fully local demo.
cloud = [
  # ADK's MCP support lives behind its own "mcp" extra. Without it google-adk
  # installs happily and `McpToolset` fails to import at call time, which is the
  # worst possible place to discover it.
  # These versions are the clean Python 3.12 / Cloud Build matrix verified by
  # the release audit. Pinning them keeps a rebuild from silently changing the
  # managed-agent or telemetry protocol immediately before judging.
  "google-adk[mcp]==2.7.1",
  "google-genai==2.19.0",
  "google-cloud-aiplatform==1.165.1",
  "agento11y==0.16.0",
  "agento11y-google-adk==0.16.0",
  "google-cloud-storage==3.13.1",
  "google-cloud-pubsub==2.39.1",
  "google-cloud-bigquery==3.43.0",
  # Upper bound because google-adk requires mcp<2: the 2.0 SDK moved
  # `mcp.shared.session`, which ADK's toolset imports. Our own client in
  # src/raccord/grafana_mcp/client.py works against either generation, but
  # pinning here stops `pip install -e ".[cloud]"` resolving to a combination in
  # which the Gemini reasoning plane cannot reach Grafana MCP at all.
  "mcp==1.29.0",
]
otel = [
  # AgentO11y 0.16 and ADK 2.7.1 share this OTel release line. Unbounded
  # requirements make pip backtrack across every OTel release in a clean build.
  "opentelemetry-sdk==1.42.1",
  "opentelemetry-exporter-otlp-proto-http==1.42.1",
  "opentelemetry-exporter-otlp-proto-common==1.42.1",
  "opentelemetry-proto==1.42.1",
  "opentelemetry-instrumentation-fastapi==0.63b1",
  "opentelemetry-instrumentation==0.63b1",
  "opentelemetry-instrumentation-asgi==0.63b1",
  "opentelemetry-instrumentation-starlette==0.63b1",
  "opentelemetry-util-http==0.63b1",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
raccord = "raccord.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raccord = ["web/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

# Selected explicitly rather than left to ruff's default set, which changes
# between releases. A lint configuration that drifts under CI is one nobody
# trusts, and CI here is meant to be believed.
[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# The programme itself: dialogue lines and their translations. Wrapping a line
# of a screenplay to satisfy a line-length rule would make the script harder to
# read and the translations harder to compare, which is the opposite of the
# point.
"src/raccord/media.py" = ["E501"]
# The audience communications are multi-line f-string templates. A `noqa` inside
# one would be rendered into the message, and rewrapping a sentence to satisfy a
# linter would change what an operator reads during an incident.
"src/raccord/agents/core.py" = ["E501"]

# AccessPulse local Grafana stack.
#
#   docker compose up -d
#   python -m accesspulse.cli serve
#
# Grafana:     http://localhost:3000  (admin / accesspulse)
# AccessPulse: http://localhost:8080
#
# With this stack running, set AP_MCP_TRANSPORT=stdio in .env to route the
# agent's investigation through the official grafana/mcp-grafana server against
# this Grafana instead of the in-process stub. Everything else is unchanged.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: accesspulse-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.3.2
    container_name: accesspulse-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.7.1
    container_name: accesspulse-tempo
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "3200:3200"   # tempo query
      - "4318:4318"   # OTLP http
      - "4317:4317"   # OTLP grpc

  pyroscope:
    image: grafana/pyroscope:1.11.0
    container_name: accesspulse-pyroscope
    ports:
      - "4040:4040"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: accesspulse-grafana
    depends_on: [prometheus, loki, tempo, pyroscope]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: accesspulse
      GF_USERS_DEFAULT_THEME: system
      GF_FEATURE_TOGGLES_ENABLE: traceToProfiles,traceqlEditor
      GF_INSTALL_PLUGINS: ""
      # Deterministic service-account token so `make grafana-token` is not needed
      # for a first run. Rotate before any non-local use.
      GF_SECURITY_ADMIN_EMAIL: admin@accesspulse.local
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The official Grafana MCP server. Started on demand:
  #   docker compose --profile mcp up -d mcp-grafana
  # AccessPulse can also spawn it itself over stdio (AP_MCP_TRANSPORT=stdio).
  mcp-grafana:
    image: mcp/grafana:latest
    container_name: accesspulse-mcp-grafana
    profiles: ["mcp"]
    depends_on: [grafana]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${AP_GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
    # streamable-http, not sse: the MCP Python SDK client in
    # src/accesspulse/grafana_mcp/client.py speaks streamable-http for the
    # "http" transport, and an sse server here refuses that handshake.
    # --allowed-hosts is required because the server derives its Host allowlist
    # from --address (0.0.0.0) while the client connects to localhost.
    command: ["-t", "streamable-http", "--address", "0.0.0.0:8000",
              "--allowed-hosts", "*"]
    ports:
      - "8000:8000"

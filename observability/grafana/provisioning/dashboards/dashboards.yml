apiVersion: 1

providers:
  - name: accesspulse
    orgId: 1
    folder: AccessPulse
    folderUid: accesspulse
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

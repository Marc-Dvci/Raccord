global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    stack: accesspulse-local

scrape_configs:
  # The AccessPulse API exposes every probe finding, SLO evaluation, session
  # aggregate, agent step and MCP call as a Prometheus series.
  - job_name: accesspulse
    metrics_path: /metrics
    static_configs:
      # 8080 is the documented default; 8099 is the fallback the docs suggest
      # when it is taken - which on Windows can happen silently, because one
      # process may bind 127.0.0.1:8080 while another owns 0.0.0.0:8080.
      # Listing both means the scrape finds the app either way; the idle port
      # simply shows as a down target.
      - targets: ["host.docker.internal:8080", "host.docker.internal:8099"]
        labels:
          service: accesspulse

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

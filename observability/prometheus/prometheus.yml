global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    stack: accesspulse-local

scrape_configs:
  # The AccessPulse API exposes every probe finding, SLO evaluation, session
  # aggregate, agent step and MCP call as a Prometheus series.
  - job_name: accesspulse
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: accesspulse

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
